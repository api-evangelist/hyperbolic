aid: hyperbolic
url: https://raw.githubusercontent.com/api-evangelist/hyperbolic/refs/heads/main/apis.yml
name: Hyperbolic
kind: company
description: >-
  Hyperbolic Labs is an open-access AI cloud offering on-demand GPU rentals and serverless
  LLM inference. Hosts 25+ open-source models with OpenAI-compatible chat, vision, image
  generation (FLUX, Stable Diffusion, LoRA), and audio (Melo TTS) APIs. Reserved-cluster
  pricing available with 3-12 month commitments and up to 40% discount.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - AI
  - LLM
  - Inference
  - GPU
  - Open Source
  - Serverless
  - Image Generation
  - Audio
created: '2026-05-08'
modified: '2026-05-08'
specificationVersion: '0.19'
apis:
  - aid: hyperbolic:inference
    name: Hyperbolic Serverless Inference API
    description: >-
      OpenAI-compatible inference API for 25+ open-source models. Surfaces include text
      chat, vision, image generation (FLUX, Stable Diffusion, LoRA adapters), and audio
      (Melo TTS). Pay-as-you-go from $0.0001 per 1K tokens.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://docs.hyperbolic.ai/docs/inference/overview
