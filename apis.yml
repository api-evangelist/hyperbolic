    name: Hyperbolic On-Demand GPU API
    description: >-
      Bare-metal GPU rental with SSH access for full control. Hourly rates from $1.39-$1.99
      with no long-term commitments. Reserved clusters available monthly/annually with up
      to 40% discount.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
