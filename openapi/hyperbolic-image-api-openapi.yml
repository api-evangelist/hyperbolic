openapi: 3.1.0
info:
  title: Hyperbolic Inference Audio Image API
  description: 'Hyperbolic offers OpenAI-compatible serverless inference for chat, completion,

    image generation and audio. Authenticate with an API key as a Bearer token.

    '
  version: 1.0.0
  contact:
    name: Hyperbolic Docs
    url: https://hyperbolic.ai/docs/
servers:
- url: https://api.hyperbolic.xyz/v1
security:
- bearerAuth: []
tags:
- name: Image
paths:
  /image/generation:
    post:
      summary: Generate image
      operationId: generateImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model_name
              - prompt
              properties:
                model_name:
                  type: string
                  example: SDXL1.0-base
                prompt:
                  type: string
                height:
                  type: integer
                width:
                  type: integer
                steps:
                  type: integer
      responses:
        '200':
          description: OK
      tags:
      - Image
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
