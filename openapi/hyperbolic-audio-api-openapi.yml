openapi: 3.1.0
info:
  title: Hyperbolic Inference Audio API
  description: 'Hyperbolic offers OpenAI-compatible serverless inference for chat, completion,

    image generation and audio. Authenticate with an API key as a Bearer token.

    '
  version: 1.0.0
  contact:
    name: Hyperbolic Docs
    url: https://hyperbolic.ai/docs/
servers:
- url: https://api.hyperbolic.xyz/v1
security:
- bearerAuth: []
tags:
- name: Audio
paths:
  /audio/generation:
    post:
      summary: Generate audio
      operationId: generateAudio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                language:
                  type: string
                speaker:
                  type: string
      responses:
        '200':
          description: OK
      tags:
      - Audio
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
